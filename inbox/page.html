<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Leyline wishlist</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6.4 25 C 19.8 27.5, 12.2 4.5, 25.6 7' fill='none' stroke='%23a78bfa' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='6.4' cy='25' r='3.2' fill='%235eead4'/%3E%3Ccircle cx='25.6' cy='7' r='3.2' fill='%23a78bfa'/%3E%3C/svg%3E">
<style>
  /* the same palette as the Leyline app: night sky with a teal to violet ley line */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --font-display: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --ley-a: #5eead4; --ley-b: #a78bfa; --ley: linear-gradient(120deg, var(--ley-a), var(--ley-b));
    --bg: #0c0d18; --card: rgba(255,255,255,0.045); --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.14);
    --text: #ecebf5; --text-2: #a9a7c0; --text-3: #6f6d88;
    --field: rgba(255,255,255,0.05); --field-focus: rgba(255,255,255,0.08);
    --ok: #5eead4; --bad: #fb7185; --on-accent: #0b0c17;
    --shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 50px -24px rgba(0,0,0,0.7);
    --glow: 0 0 0 1px rgba(167,139,250,0.25), 0 10px 30px -10px rgba(94,234,212,0.35);
    --halo: rgba(167,139,250,0.20); color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ley-a: #0d9488; --ley-b: #7c3aed;
      --bg: #f6f5fb; --card: #ffffff; --line: rgba(30,24,80,0.08); --line-strong: rgba(30,24,80,0.15);
      --text: #1a1830; --text-2: #56536f; --text-3: #8b88a3;
      --field: rgba(30,24,80,0.035); --field-focus: #ffffff;
      --ok: #0d9488; --bad: #e11d48; --on-accent: #ffffff;
      --shadow: 0 1px 2px rgba(30,24,80,0.04), 0 12px 32px -18px rgba(30,24,80,0.25);
      --glow: 0 0 0 1px rgba(124,58,237,0.2), 0 10px 24px -12px rgba(13,148,136,0.45);
      --halo: rgba(124,58,237,0.12); color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--bg) radial-gradient(900px 420px at 80% -8%, var(--halo), transparent 70%) no-repeat; }
  body {
    font: 15px/1.5 var(--font-ui); color: var(--text); background: transparent; -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand svg { width: 30px; height: 30px; filter: drop-shadow(0 2px 8px rgba(94,234,212,0.25)); }
  .brand span { font: 600 21px/1 var(--font-display); letter-spacing: 0.2px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-3); }
  h1 { font: 600 30px/1.15 var(--font-display); letter-spacing: -0.2px; margin: 6px 0 8px; }
  .sub { color: var(--text-2); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 6px 2px; }
  .field { margin-bottom: 14px; }
  input {
    width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; font: inherit; font-size: 16px; /* 16px keeps iOS from zooming in */
    color: var(--text); border: 1px solid var(--line-strong); background: var(--field); outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder { color: var(--text-3); }
  input:focus { border-color: color-mix(in srgb, var(--ley-b) 55%, transparent); background: var(--field-focus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ley-b) 14%, transparent); }
  button {
    width: 100%; height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer;
    background: var(--ley); color: var(--on-accent); box-shadow: var(--glow); transition: transform .12s, filter .15s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; }
  #msg { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-top: 14px; font-size: 14px; color: var(--text-2); }
  #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }
  #msg svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #tokenField[hidden] { display: none; }
  .foot { margin-top: 22px; text-align: center; font-size: 12.5px; color: var(--text-3); }
  .foot a { color: var(--text-2); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="bm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="var(--ley-a)"/><stop offset="1" stop-color="var(--ley-b)"/></linearGradient></defs>
      <path d="M6.4 25 C 19.8 27.5, 12.2 4.5, 25.6 7" fill="none" stroke="url(#bm)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="6.4" cy="25" r="3.2" fill="var(--ley-a)"/><circle cx="25.6" cy="7" r="3.2" fill="var(--ley-b)"/>
      <circle cx="16" cy="16" r="2.4" fill="url(#bm)" stroke="var(--bg)" stroke-width="1.6"/>
    </svg>
    <span>Leyline</span>
  </div>
  <div class="eyebrow">Wishlist</div>
  <h1>Add an addon</h1>
  <p class="sub">Paste a link from CurseForge, Wago, WoWInterface or GitHub, or just type the addon's name. It shows up in the Leyline app on your computers.</p>
  <form id="f" class="card" autocomplete="off">
    <div class="field"><label for="url">Addon link or name</label>
      <input id="url" type="text" inputmode="url" placeholder="A link, or a name like Plater" required autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="note">Note <span style="font-weight:400">(optional)</span></label>
      <input id="note" placeholder="Why you want to try it" maxlength="300"></div>
    <div class="field" id="tokenField" hidden><label for="token">Token</label>
      <input id="token" type="password" placeholder="Asked once, then remembered on this device" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <button id="go">Add to wishlist</button>
    <div id="msg" role="status"></div>
  </form>
  <p class="foot">Tip: in Safari, Share → Add to Home Screen puts this page on your home screen.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const ICON = { ok: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', bad: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>' };
  const say = (kind, text) => { $('msg').className = kind || ''; $('msg').innerHTML = (ICON[kind] || '') + '<span></span>'; $('msg').lastChild.textContent = text; };
  const store = { get: () => { try { return localStorage.getItem('leylineToken') || ''; } catch { return ''; } }, set: (v) => { try { localStorage.setItem('leylineToken', v); } catch {} } };

  $('token').value = store.get();
  $('tokenField').hidden = !!$('token').value; // only asked for until it has worked once
  const q = new URLSearchParams(location.search);
  $('url').value = q.get('url') || q.get('text') || '';
  if (!$('url').value) $('url').focus();

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = $('token').value.trim();
    if (!token) { $('tokenField').hidden = false; $('token').focus(); return say('bad', 'Enter the token once.'); }
    $('go').disabled = true; say('', 'Sending…');
    try {
      const r = await fetch('add', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: JSON.stringify({ url: $('url').value, note: $('note').value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { store.set(token); $('tokenField').hidden = true; say('ok', j.name ? 'Saved "' + j.name + '". Pick the right addon in Leyline.' : 'Added. It will show up in Leyline.'); $('url').value = ''; $('note').value = ''; }
      else { if (r.status === 401) { $('tokenField').hidden = false; $('token').focus(); } say('bad', j.error || 'Failed (' + r.status + ').'); }
    } catch { say('bad', 'Could not reach the server. Is Tailscale on?'); }
    $('go').disabled = false;
  });
</script>
</body>
</html>
