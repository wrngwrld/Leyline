<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Leyline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="drag"></div>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="bm" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="var(--ley-a)"/><stop offset="1" stop-color="var(--ley-b)"/>
            </linearGradient>
          </defs>
          <path d="M6.4 25 C 19.8 27.5, 12.2 4.5, 25.6 7" fill="none" stroke="url(#bm)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="6.4" cy="25" r="3.2" fill="var(--ley-a)"/>
          <circle cx="25.6" cy="7" r="3.2" fill="var(--ley-b)"/>
          <circle cx="16" cy="16" r="2.4" fill="url(#bm)" stroke="var(--sidebar-solid)" stroke-width="1.6"/>
        </svg>
        <span class="brand-name">Leyline</span>
      </div>
      <nav class="nav" id="nav">
        <button data-page="overview" class="active">
          <svg viewBox="0 0 24 24"><path d="M4 13.5 12 5l8 8.5"/><path d="M6.5 11v8h11v-8"/></svg><span>Overview</span>
        </button>
        <button data-page="versions">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Game versions</span>
        </button>
        <button data-page="nas">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></svg><span>NAS</span>
        </button>
        <button data-page="computers">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="9" rx="1.5"/><path d="M1.5 17.5h15"/><rect x="17.5" y="7" width="5" height="11" rx="1.2"/></svg><span>Computers</span>
        </button>
        <button data-page="history">
          <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/><path d="M12 8v4.5l3 2"/></svg><span>History</span>
        </button>
        <button data-page="settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div id="update-slot"></div>
        <div class="machine" id="machine"></div>
      </div>
    </aside>

    <main class="main">
      <div class="drag main-drag"></div>
      <div class="page" id="page"></div>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
