name: Bug report
description: Something in Leyline does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please leave out passwords, NAS addresses and anything else private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Leyline version
      description: Shown in Leyline under Settings.
      placeholder: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 27.2 / Windows 11 25H2"
  - type: input
    id: nas
    attributes:
      label: NAS
      description: Make and system, if it matters for the problem.
      placeholder: "Unraid 7, Synology DSM 7, …"
  - type: input
    id: flavors
    attributes:
      label: Game versions involved
      placeholder: "Retail, Classic Era, …"
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: The message from the window or the History page, if there was one.
      render: text
