# Run by hand: Actions → Release → Run workflow, enter the new version.
# Bumps the version, tags it, builds Windows and macOS installers on their own platforms
# (macOS signed with Developer ID and notarized; needs the MAC_CERT_* and APPLE_API_* secrets),
# writes release notes from the commits since the last release and publishes the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.2.0"
        required: true
        type: string
      highlights:
        description: "Optional summary at the top of the release notes"
        required: false
        type: string
      dry_run:
        description: "Dry run: only build the installers (download them from this run), no tag or release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: Prepare v${{ inputs.version }}
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Check version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi

      - name: Write release notes
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: node scripts/release-notes.mjs --version "$VERSION" --highlights "$HIGHLIGHTS" --repo "$GITHUB_REPOSITORY" > release-notes.md && cat release-notes.md

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: release-notes.md

      - name: Bump version, commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Leyline $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$VERSION"

      - id: ref
        name: Choose what to build
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; else echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"; fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            # installer plus the files the in-app updater reads (latest*.yml, blockmaps)
            files: |
              dist/Leyline-Setup-*.exe
              dist/Leyline-Setup-*.exe.blockmap
              dist/latest.yml
          - name: macOS
            os: macos-latest
            script: dist:mac
            files: |
              dist/Leyline-*.dmg
              dist/Leyline-*.dmg.blockmap
              dist/Leyline-*-mac.zip
              dist/Leyline-*-mac.zip.blockmap
              dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set version (dry run builds from the current commit)
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build installer (Windows, unsigned)
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no Windows signing certificate yet

      # macOS: signed with the Developer ID Application certificate and notarized by Apple.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for macOS signing:$missing"; exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build installer (macOS, signed and notarized)
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.script }} -- -c.mac.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          app=dist/mac-arm64/Leyline.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "^Authority=Developer ID Application:"
          codesign -dv --verbose=4 "$app/Contents/Resources/rclone/rclone" 2>&1 | grep -E "^Authority=Developer ID Application:"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          # the in-app updater installs the zip; make sure it is listed and holds the notarized app
          grep -E "^[[:space:]]+- url: Leyline-.*-mac\.zip$" dist/latest-mac.yml
          check="$RUNNER_TEMP/zipcheck" && rm -rf "$check" && mkdir -p "$check"
          ditto -x -k dist/Leyline-*-mac.zip "$check"
          xcrun stapler validate "$check/Leyline.app"
          spctl --assess --type execute --verbose=4 "$check/Leyline.app"

      - name: Remove signing key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "v$VERSION" out/Leyline-* out/latest*.yml \
            --repo "$GITHUB_REPOSITORY" \
            --title "Leyline $VERSION" \
            --notes-file out/release-notes.md
