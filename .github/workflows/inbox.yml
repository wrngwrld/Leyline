name: Phone inbox image

# Builds the small server in inbox/ (the phone's link to your wishlist) and publishes it as
# ghcr.io/<owner>/leyline-inbox. Not part of the app releases.
on:
  push:
    branches: [main]
    paths: ['inbox/**', '.github/workflows/inbox.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/leyline-inbox" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: inbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
