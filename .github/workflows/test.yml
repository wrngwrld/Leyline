name: Tests

# Engine tests: retries with a fake rclone, and two computers syncing through a folder
# with the real rclone. No NAS or app build needed.
on:
  push:
    branches: [main]
    paths-ignore: ['inbox/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node scripts/fetch-rclone.mjs linux-x64
      - run: npm test
